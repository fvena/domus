name: Validate PRs

on:
    pull_request:
        branches: [main]

env:
    TURBO_TELEMETRY_DISABLED: "1"
    DO_NOT_TRACK: "1"

jobs:
    secrets:
        name: Secret scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            # Every commit of the branch, not only the last: the repository is public.
            - name: Scan with gitleaks
              run: >-
                  docker run --rm -v "$PWD:/repo"
                  -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="*"
                  zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner

    lint:
        name: Lint and format check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - uses: pnpm/action-setup@v4
            - name: Install dependencies
              run: pnpm install
            - name: Run oxlint and the dependency rules
              run: pnpm lint
            - name: Check formatting
              run: pnpm format:check

    generated:
        name: Generated files are up to date
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - uses: pnpm/action-setup@v4
            - name: Install dependencies
              run: pnpm install
            # stdin closed: if drizzle-kit has a question, the job fails. Generate locally and review.
            - name: Regenerate migrations
              timeout-minutes: 5
              run: pnpm db:generate < /dev/null
            # New untracked files count too: a migration nobody committed is a change.
            - name: Nothing changed
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                      echo "Generated files are stale: run pnpm db:generate and commit the result." >&2
                      git status --porcelain
                      git --no-pager diff
                      exit 1
                  fi

    type-check:
        name: Type check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - uses: pnpm/action-setup@v4
            - name: Install dependencies
              run: pnpm install
            - name: Run TypeScript
              run: pnpm type-check

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - uses: pnpm/action-setup@v4
            - name: Install dependencies
              run: pnpm install
            - name: Build all apps
              run: pnpm build

    unit:
        name: Run unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - uses: pnpm/action-setup@v4
            - name: Install dependencies
              run: pnpm install
            - name: Run unit tests
              run: pnpm test

    docker:
        name: Build the images
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                target: [api, assistant, voice-gateway]
        steps:
            - uses: actions/checkout@v4
            - name: Build ${{ matrix.target }}
              run: docker build --file docker/Dockerfile --target ${{ matrix.target }} .
