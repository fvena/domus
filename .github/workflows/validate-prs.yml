name: Validate PRs

on:
    pull_request:
        branches: [main]

env:
    TURBO_TELEMETRY_DISABLED: "1"
    DO_NOT_TRACK: "1"

jobs:
    lint:
        name: Lint and format check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - uses: pnpm/action-setup@v4
            - name: Install dependencies
              run: pnpm install
            - name: Run oxlint and the dependency rules
              run: pnpm lint
            - name: Check formatting
              run: pnpm format:check

    type-check:
        name: Type check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - uses: pnpm/action-setup@v4
            - name: Install dependencies
              run: pnpm install
            - name: Run TypeScript
              run: pnpm type-check

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - uses: pnpm/action-setup@v4
            - name: Install dependencies
              run: pnpm install
            - name: Build all apps
              run: pnpm build

    unit:
        name: Run unit tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - uses: pnpm/action-setup@v4
            - name: Install dependencies
              run: pnpm install
            - name: Run unit tests
              run: pnpm test

    docker:
        name: Build the images
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                target: [api, assistant, voice-gateway]
        steps:
            - uses: actions/checkout@v4
            - name: Build ${{ matrix.target }}
              run: docker build --file docker/Dockerfile --target ${{ matrix.target }} .
