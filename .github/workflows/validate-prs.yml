name: Validate PRs

on:
    pull_request:
        branches: [main]

env:
    TURBO_TELEMETRY_DISABLED: "1"
    DO_NOT_TRACK: "1"

jobs:
    secrets:
        name: Secret scan
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            # Every commit of the branch, not only the last: the repository is public.
            - name: Scan with gitleaks
              run: >-
                  docker run --rm -v "$PWD:/repo"
                  -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="*"
                  zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner

    lint:
        name: Lint and format check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - uses: pnpm/action-setup@v4
            - name: Install dependencies
              run: pnpm install
            - name: Run oxlint and the dependency rules
              run: pnpm lint
            - name: Check formatting
              run: pnpm format:check

    generated:
        name: Generated files are up to date
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - uses: pnpm/action-setup@v4
            - name: Install dependencies
              run: pnpm install
            # stdin closed: if a generator has a question, the job fails. Generate locally and review.
            - name: Regenerate migrations
              timeout-minutes: 5
              run: pnpm db:generate < /dev/null
            - name: Regenerate the module lists
              timeout-minutes: 5
              run: pnpm modules:generate < /dev/null
            # New untracked files count too: a migration nobody committed is a change.
            - name: Nothing changed
              run: |
                  if [ -n "$(git status --porcelain)" ]; then
                      echo "Generated files are stale: run pnpm db:generate and pnpm modules:generate, and commit the result." >&2
                      git status --porcelain
                      git --no-pager diff
                      exit 1
                  fi

    type-check:
        name: Type check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - uses: pnpm/action-setup@v4
            - name: Install dependencies
              run: pnpm install
            - name: Run TypeScript
              run: pnpm type-check

    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - uses: pnpm/action-setup@v4
            - name: Install dependencies
              run: pnpm install
            - name: Build all apps
              run: pnpm build

    unit:
        name: Run unit tests
        runs-on: ubuntu-latest
        steps:
            # The restic of the api image (Debian trixie, 0.18.0), from its official release and checked against its
            # published checksum: the runner's Ubuntu has one older than the exit codes the backups read. Not in a
            # container, so the tests run as an ordinary user, as on a laptop: as root, a folder without permissions
            # would not stop them.
            - name: Install restic
              env:
                  RESTIC_VERSION: 0.18.0
                  RESTIC_SHA256: 98f6dd8bf5b59058d04bfd8dab58e196cc2a680666ccee90275a3b722374438e
              run: |
                  curl -fsSLo restic.bz2 "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
                  echo "${RESTIC_SHA256}  restic.bz2" | sha256sum --check
                  bunzip2 restic.bz2
                  sudo install -m 755 restic /usr/local/bin/restic
                  rm restic
                  restic version
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
            - uses: pnpm/action-setup@v4
            - name: Install dependencies
              run: pnpm install
            - name: Run unit tests
              run: pnpm test

    docker:
        name: Build the images
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                target: [api, assistant, voice-gateway]
        steps:
            - uses: actions/checkout@v4
            - name: Build ${{ matrix.target }}
              run: docker build --file docker/Dockerfile --target ${{ matrix.target }} .

    containers:
        name: The containers start healthy
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
            # An image can build and still crash at startup (a bundled native module, a missing setting, a
            # broken migration): start the three as on the Pi and wait for their health checks.
            # The api refuses to start without its session secret; CI makes a throwaway one per run.
            - name: A throwaway session secret
              run: echo "DOMUS_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
            # The backups' password is a compose secret from a file, mounted as it is: 600 and owned by uid 1000,
            # the container's `node`, which the runner's user is not.
            - name: A throwaway backups password
              run: |
                  file="$RUNNER_TEMP/backup-password"
                  openssl rand -hex 32 > "$file"
                  chmod 600 "$file"
                  sudo chown 1000:1000 "$file"
                  echo "DOMUS_BACKUP_PASSWORD=$file" >> "$GITHUB_ENV"
            - name: Start the three containers
              run: docker compose up --detach --build --wait --wait-timeout 240
            # The restore command as the Pi runs it: its bundle, the mounted secret and reading it. Listing takes no
            # lock, so api may keep running; an empty repository has no snapshot yet and answers without error.
            - name: The restore command lists the snapshots
              run: docker compose run --rm --no-deps --entrypoint node api /app/restore.mjs list
            - name: Logs
              if: failure()
              run: docker compose logs --no-color
            - name: Stop
              if: always()
              run: docker compose down --volumes
