# Domus: `docker compose up -d --build`, then open http://localhost:3000.
# Three containers, each restarted on its own (docs/architecture/adr/0003-procesos-y-contenedores.md).
# The web app is not a container of its own: the api serves its built files.
name: domus

x-hardening: &hardening
    read_only: true
    tmpfs:
        - /tmp
    cap_drop:
        - ALL
    security_opt:
        - no-new-privileges:true
    restart: unless-stopped

services:
    api:
        <<: *hardening
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: api
        image: domus-api:local
        ports:
            - "3000:3000"
        volumes:
            - domus-data:/data
            # The restic repository of the backups (ADR 0026), mounted only here: on the Pi the `.env` sets
            # DOMUS_BACKUPS=/srv/backups/domus; elsewhere it is a named volume.
            - ${DOMUS_BACKUPS:-domus-backups}:/backups
        secrets:
            - backup-password
        environment:
            TZ: ${TZ:-Europe/Madrid}
            # Both come from the `.env` next to this file, which is not in git (docs/despliegue.md).
            DOMUS_AUTH_SECRET: ${DOMUS_AUTH_SECRET:?set DOMUS_AUTH_SECRET in .env}
            DOMUS_ORIGINS: ${DOMUS_ORIGINS:-http://localhost:3000}

    assistant:
        <<: *hardening
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: assistant
        image: domus-assistant:local
        # No data volume, by construction: Kira reaches Domus only through the api (adr/0005-kira-aislada.md).
        environment:
            DOMUS_API_URL: http://api:3000
            TZ: ${TZ:-Europe/Madrid}
        depends_on:
            api:
                condition: service_healthy

    voice-gateway:
        <<: *hardening
        build:
            context: .
            dockerfile: docker/Dockerfile
            target: voice-gateway
        image: domus-voice-gateway:local
        environment:
            DOMUS_API_URL: http://api:3000
            TZ: ${TZ:-Europe/Madrid}
        depends_on:
            api:
                condition: service_healthy

volumes:
    domus-data:
    domus-backups:

secrets:
    # The password of the backups' repository, at /run/secrets/backup-password in api: a file outside the
    # repository, with permissions 600 and owned by uid 1000, the container's `node`.
    backup-password:
        file: ${DOMUS_BACKUP_PASSWORD:?set DOMUS_BACKUP_PASSWORD in .env to the file with the backups password}
